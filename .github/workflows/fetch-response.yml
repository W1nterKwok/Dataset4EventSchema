name: Download official RESPONSE v1
on: workflow_dispatch
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fetch_response.py --output response-download
      - uses: actions/upload-artifact@v4
        with:
          name: response-v1
          path: response-download/
          if-no-files-found: error
